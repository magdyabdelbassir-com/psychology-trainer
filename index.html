<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الأوبئة | تحدي الذاكرة والمقارنات</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Changa:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #020617; 
            color: #f8fafc;
            overflow-x: hidden;
        }
        .title-font { font-family: 'Changa', sans-serif; }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; }
        .bounce-in { animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        .pulse-glow { animation: pulseGlow 2s infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); } 50% { box-shadow: 0 0 30px rgba(56, 189, 248, 0.8); } 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); } }
        
        .stars-bg {
            background-image: radial-gradient(circle, #fbbf24 1px, transparent 1px);
            background-size: 40px 40px;
            animation: moveStars 30s linear infinite;
        }
        @keyframes moveStars { from { background-position: 0 0; } to { background-position: 100% 100%; } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-24 selection:bg-sky-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Icons ---
        const BrainIcon = () => <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"/></svg>;
        const TargetIcon = () => <svg className="w-6 h-6 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
        const CompareIcon = () => <svg className="w-6 h-6 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>;
        const PlayIcon = () => <svg className="w-6 h-6 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
        const MaleIcon = () => <svg className="w-16 h-16 text-blue-400 mb-2 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>;
        const FemaleIcon = () => <svg className="w-16 h-16 text-pink-400 mb-2 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>;
        const ChildIcon = () => <span className="text-3xl">🧸</span>;
        const TeenIcon = () => <span className="text-3xl">🎒</span>;
        const AdultIcon = () => <span className="text-3xl">💼</span>;

        // --- Data (Updated with Stages & Age Groups) ---
        const comparisonsData = {
            "طيف الفصام": {
                arab: [
                    { country: "مصر", fact: "15.3% (من المترددين على عيادات الطب النفسي)" },
                    { country: "الإمارات", fact: "0.7% (مدينة العين، انتشار مجتمعي)" },
                    { country: "لبنان", fact: "ضمن 25.8% (ذهان ككل، حروب ونزوح)" },
                    { country: "البحرين", fact: "1.29 لكل 10,000 (معدل حدوث سنوي)" }
                ],
                foreign: [
                    { country: "السويد", fact: "يصل لـ 3% (من أعلى النسب لدقة الإحصاء)" },
                    { country: "أمريكا", fact: "1% إلى 1.5% (نسبة ثابتة وتكلفة 100 مليار$)" },
                    { country: "بريطانيا", fact: "1% (تزداد في الطبقات الدنيا - Social Drift)" },
                    { country: "عالمياً", fact: "يمثل مرضاه 60% لـ 70% من نزلاء المستشفيات العقلية" }
                ],
                stages: [
                    { 
                        phase: "مرحلة الطفولة", icon: <ChildIcon/>,
                        male: "نادر جداً، ولكن إن حدث يكون الذكور أكثر عرضة للظهور المبكر.",
                        female: "نادر للغاية، وتكاد تنعدم الإصابات الموثقة في هذه المرحلة."
                    },
                    { 
                        phase: "المراهقة والشباب", icon: <TeenIcon/>,
                        male: "الذروة الأولى للذكور (15-25 سنة). تكون الأعراض أشد سلبية وأكثر تدهوراً.",
                        female: "ظهور أقل في هذه المرحلة، حيث تتأخر بداية المرض لديهن."
                    },
                    { 
                        phase: "البلوغ وكبار السن", icon: <AdultIcon/>,
                        male: "تقل نسب الحالات الجديدة المكتشفة، ويتحول لمرض مزمن.",
                        female: "الذروة الأولى للإناث (25-35 سنة)، ولديهن ذروة ثانية بعد الأربعين (انقطاع الطمث)."
                    }
                ]
            },
            "ثنائي القطب": {
                arab: [
                    { country: "مصر", fact: "نسبة ضئيلة بالعيادات (أقل من 1%) مقارنة بالاكتئاب." },
                    { country: "المغرب العربي", fact: "ضمن 10.6% للاضطرابات المزاجية (المغرب، تونس، الجزائر)." },
                    { country: "الإمارات", fact: "1.9% للاضطرابات الذهانية والهوس ككل (دبي)." },
                    { country: "لبنان", fact: "ضمن 12.6% للاضطرابات المزاجية ككل." }
                ],
                foreign: [
                    { country: "أمريكا", fact: "0.6% لثنائي القطب I، و 0.8% لثنائي القطب II." },
                    { country: "السويد", fact: "بين 1% إلى 2%، مع تداخل وراثي واضح." },
                    { country: "أوروبا", fact: "حوالي 1.3% للبالغين." },
                    { country: "عالمياً", fact: "متوسط 1% إلى 2.4% (يتزامن مع إدمان الكحوليات بـ 50%)." }
                ],
                stages: [
                    { 
                        phase: "مرحلة الطفولة", icon: <ChildIcon/>,
                        male: "يصعب تشخيصه بدقة، قد يظهر كعدوانية أو فرط حركة شديد وغير مبرر.",
                        female: "نادر التشخيص في الطفولة المبكرة."
                    },
                    { 
                        phase: "المراهقة والشباب", icon: <TeenIcon/>,
                        male: "متوسط الظهور (18 سنة). يميل الذكور لظهور نوبات الهوس الصريح (النوع الأول I).",
                        female: "بداية الظهور. تميل الإناث للبدء بنوبات اكتئاب تتبعها تحت هوس (النوع الثاني II)."
                    },
                    { 
                        phase: "البلوغ وكبار السن", icon: <AdultIcon/>,
                        male: "زيادة كبيرة في احتمالية الإدمان المرافق للسيطرة على الهوس.",
                        female: "تكون الإناث أكثر عرضة لنمط التكرار السريع (Rapid Cycling) واكتئاب أطول."
                    }
                ]
            },
            "الوسواس القهري": {
                arab: [
                    { country: "مصر", fact: "2.6% من رواد العيادات (معظمهم شباب 20-30 سنة)." },
                    { country: "الخليج", fact: "يمثل 4% من إجمالي الاضطرابات العصابية." },
                    { country: "قطر/البحرين", fact: "10-15% سلوك تكرار بسيط بين طلاب الجامعات." },
                    { country: "لبنان", fact: "ضمن 16.7% لاضطرابات القلق." }
                ],
                foreign: [
                    { country: "أمريكا", fact: "2.5% مدى الحياة. (من أشد الاضطرابات ألماً)." },
                    { country: "بريطانيا", fact: "الرابع عالمياً من حيث الانتشار." },
                    { country: "السويد", fact: "حوالي 2%، وعلاج معرفي سلوكي مرتفع (CBT)." },
                    { country: "عالمياً", fact: "النسبة متقاربة جداً بين الجنسين ككل." }
                ],
                stages: [
                    { 
                        phase: "مرحلة الطفولة", icon: <ChildIcon/>,
                        male: "بداية مبكرة جداً (أسرع من الإناث). حوالي 25% من الذكور يبدأ لديهم قبل العاشرة.",
                        female: "نسبة الإصابة وبداية الظهور أقل في الطفولة."
                    },
                    { 
                        phase: "المراهقة والشباب", icon: <TeenIcon/>,
                        male: "تستمر الأعراض، وتميل للأفعال القهرية المتعلقة بالترتيب أو التماثل.",
                        female: "تزداد النسبة وتلحق بالذكور، وغالباً ترتبط ببداية فترة البلوغ."
                    },
                    { 
                        phase: "البلوغ وكبار السن", icon: <AdultIcon/>,
                        male: "تستقر النسبة وتصبح مزمنة.",
                        female: "تتخطى نسبة الذكور، وتظهر ذروة واضحة مرتبطة بفترات الحمل والولادة (وساوس الأذى للطفل)."
                    }
                ]
            },
            "التحكم في السلوك الاندفاعي": {
                arab: [
                    { country: "لبنان", fact: "4.4% انتشار لاضطرابات التحكم في الاندفاعات ككل." },
                    { country: "دول المغرب", fact: "4.5% (الجزائر، المغرب، تونس)." },
                    { country: "مصر", fact: "2% بالعيادات لـ(نوبات العدوان الفجائية)، سرقة مخفية." },
                    { country: "الإمارات", fact: "غياب أرقام دقيقة لطبيعة الوصمة والقانون." }
                ],
                foreign: [
                    { country: "أمريكا", fact: "1% إلى 3% للمقامرة المرضية وحدها." },
                    { country: "بريطانيا", fact: "العدوان الفجائي يمثل 2%." },
                    { country: "كندا", fact: "هوس نتف الشعر 2% من الجمهور." },
                    { country: "عالمياً", fact: "الذكور يتواجدون بالسجون بدلاً من العيادات." }
                ],
                stages: [
                    { 
                        phase: "مرحلة الطفولة", icon: <ChildIcon/>,
                        male: "تظهر مبكراً كاضطرابات مسلك، عناد، عدوانية، وأحياناً القسوة مع الحيوانات (ثالوث ماكدونالد).",
                        female: "الاندفاعية أقل حدة وعنفاً."
                    },
                    { 
                        phase: "المراهقة والشباب", icon: <TeenIcon/>,
                        male: "تتطور لنوبات عدوان فجائي وهوس إشعال حرائق (Pyromania) والمخاطرة.",
                        female: "تظهر لديهن اندفاعات موجهة للذات كـ هوس نتف الشعر (Trichotillomania)."
                    },
                    { 
                        phase: "البلوغ وكبار السن", icon: <AdultIcon/>,
                        male: "استمرار المقامرة المرضية والعدوان، وعواقب قانونية ومساءلة.",
                        female: "يبرز هوس السرقة (Kleptomania) كاستجابة لتخفيف التوتر والقلق، وليس للاحتياج المادي."
                    }
                ]
            }
        };

        // --- Games Data ---
        // Game 1: Gender & Age Challenge
        const genderGameQuestions = [
            { text: "في مرحلة الطفولة: من يبدأ لديه الوسواس القهري أبكر (حوالي 25% قبل العاشرة)؟", answer: "male" },
            { text: "في البلوغ: من لديه ذروة ثانية لظهور الفصام بعد سن الأربعين؟", answer: "female" },
            { text: "في المراهقة: من يميل لظهور نوبات الهوس الصريح في ثنائي القطب كأول نوبة؟", answer: "male" },
            { text: "في الطفولة: تظهر الاندفاعية لديهم في شكل اضطرابات مسلك وقسوة؟", answer: "male" },
            { text: "في البلوغ: الوسواس القهري يزداد لديهم ويرتبط بفترات الحمل وما بعد الولادة؟", answer: "female" },
            { text: "في المراهقة: يميلون لاندفاعات هوس نتف الشعر بدلاً من إشعال الحرائق؟", answer: "female" },
            { text: "في البلوغ: ثنائي القطب يتزامن لديهم بقوة مع إدمان الكحوليات (50%)؟", answer: "male" },
            { text: "في الشباب: الفصام يبدأ لديهم متأخراً (25-35 سنة)؟", answer: "female" },
            { text: "في البلوغ: من يميلون أكثر لهوس السرقة لتخفيف القلق والتوتر؟", answer: "female" }
        ];

        // Game 2: Country Maps
        const countryGameQuestions = [
            { text: "نسبة 15.3% من المترددين على عيادات الطب النفسي (طيف الفصام)", options: ["مصر", "الإمارات", "لبنان", "السويد"], answer: "مصر" },
            { text: "معدل 25.8% للاضطرابات الذهانية بسبب ظروف النزوح والحروب", options: ["البحرين", "لبنان", "بريطانيا", "أمريكا"], answer: "لبنان" },
            { text: "انتشار مجتمعي 0.7% بمدينة العين (طيف الفصام متساوٍ بين الجنسين)", options: ["مصر", "الإمارات", "قطر/البحرين", "المغرب العربي"], answer: "الإمارات" },
            { text: "تصل نسبة الفصام إلى 3% وهي من أعلى النسب عالمياً لدقة التسجيل", options: ["الصين/آسيا", "أمريكا", "السويد", "بريطانيا"], answer: "السويد" },
            { text: "نسبة الفصام 1-1.5% وتكلفة العلاج باهظة تصل لـ 100 مليار دولار", options: ["بريطانيا", "أمريكا", "كندا", "السويد"], answer: "أمريكا" },
            { text: "سلوك تكرار بسيط بنسبة 10-15% بين طلاب الجامعات (وسواس قهري)", options: ["مصر", "قطر/البحرين", "لبنان", "الإمارات"], answer: "قطر/البحرين" },
            { text: "تمثل نوبات العدوان الفجائي 2% بالعيادات وهوس السرقة مخفي", options: ["مصر", "بريطانيا", "كندا", "دول المغرب"], answer: "مصر" }
        ];

        // Game 3: True / False
        const tfGameQuestions = [
            { text: "الإناث أكثر عرضة للإصابة بالفصام في مرحلة الطفولة مقارنة بالذكور.", answer: false, explanation: "الفصام في الطفولة نادر جداً، وإذا حدث يميل أكثر للذكور." },
            { text: "في ثنائي القطب، تعاني الإناث في مرحلة البلوغ من (التكرار السريع) ونوبات اكتئاب أطول.", answer: true, explanation: "صحيح، الإناث يملن لثنائي القطب II مع اكتئاب وتكرار سريع." },
            { text: "الذكور يبدأ لديهم الوسواس القهري في الطفولة أبكر من الإناث.", answer: true, explanation: "نعم، 25% من الذكور يبدأ لديهم قبل العاشرة." },
            { text: "نوبات العدوان الفجائي والمقامرة المرضية في مرحلة الشباب تكون متساوية بين الجنسين.", answer: false, explanation: "الذكور أعلى بكثير في الاندفاعيات العنيفة والمقامرة." },
            { text: "في مصر، معظم مرضى الوسواس القهري المترددين على العيادات هم من الشباب بين 20-30 سنة.", answer: true, explanation: "معلومة صحيحة بنسبة 2.6% بالعيادات." },
            { text: "هوس السرقة في مرحلة البلوغ منتشر بين الذكور لتلبية الاحتياجات المادية.", answer: false, explanation: "هوس السرقة (Kleptomania) أكثر في الإناث، ويكون لتخفيف القلق وليس لدافع مادي." }
        ];

        // --- App Component ---
        const App = () => {
            const [view, setView] = useState('intro'); // intro, assignment, games_hub, game, game_result
            const [activeTab, setActiveTab] = useState("طيف الفصام");
            
            // Game State
            const [gameType, setGameType] = useState(''); 
            const [gameQIndex, setGameQIndex] = useState(0);
            const [gameScore, setGameScore] = useState(0);
            const [gameModal, setGameModal] = useState(null);

            const disorders = Object.keys(comparisonsData);

            const startGame = (type) => {
                setGameType(type);
                setGameQIndex(0);
                setGameScore(0);
                setGameModal(null);
                setView('game');
            };

            const getActiveQuestionsList = () => {
                if (gameType === 'gender') return genderGameQuestions;
                if (gameType === 'country') return countryGameQuestions;
                if (gameType === 'tf') return tfGameQuestions;
                return [];
            };

            const handleAnswerClick = (selectedAnswer) => {
                const currentQuestions = getActiveQuestionsList();
                const currentQ = currentQuestions[gameQIndex];
                const isCorrect = selectedAnswer === currentQ.answer;
                
                if (isCorrect) setGameScore(prev => prev + 1);

                let correctAnswerText = "";
                if (gameType === 'gender') correctAnswerText = currentQ.answer === 'male' ? "الذكور 👨" : "الإناث 👩";
                else if (gameType === 'country') correctAnswerText = currentQ.answer;
                else if (gameType === 'tf') correctAnswerText = (currentQ.answer ? "صح ✅" : "خطأ ❌") + (currentQ.explanation ? `\n(${currentQ.explanation})` : "");

                setGameModal({
                    isCorrect,
                    title: isCorrect ? "وحش المذاكرة! 🥇" : "إجابة من المريخ! 🤡",
                    correctText: correctAnswerText
                });
            };

            const nextGameQ = () => {
                setGameModal(null);
                const totalQ = getActiveQuestionsList().length;
                if (gameQIndex + 1 < totalQ) {
                    setGameQIndex(prev => prev + 1);
                } else {
                    setView('game_result');
                }
            };

            // --- Views ---
            if (view === 'intro') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen text-center px-4 fade-in">
                        <div className="mb-6 pulse-glow rounded-full p-2 bg-sky-900/30">
                            <BrainIcon />
                        </div>
                        <h1 className="text-5xl md:text-7xl font-black title-font text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400 mb-6 drop-shadow-lg">
                            موسوعة الأوبئة العقلية
                        </h1>
                        <p className="text-xl md:text-2xl text-slate-300 max-w-2xl leading-relaxed mb-10">
                            تم تحديث المنصة لتشمل <strong className="text-pink-400">الفروق بين الذكور والإناث في كافة المراحل العمرية</strong> حسب تعليمات المقرر.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-6 w-full max-w-2xl">
                            <button onClick={() => setView('assignment')} className="flex-1 py-5 bg-gradient-to-l from-indigo-600 to-purple-600 hover:scale-105 rounded-2xl font-bold text-xl transition-transform shadow-[0_10px_30px_rgba(79,70,229,0.5)] border-2 border-indigo-400">
                                <CompareIcon /> غرفة المقارنات <br/><span className="text-sm font-normal">(الأعمار والدول)</span>
                            </button>
                            <button onClick={() => setView('games_hub')} className="flex-1 py-5 bg-slate-800 border-2 border-emerald-500 hover:bg-slate-700 rounded-2xl font-bold text-xl transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)]">
                                <TargetIcon /> أكاديمية الألعاب <br/><span className="text-sm font-normal">(اختبر الحفظ)</span>
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'assignment') {
                const data = comparisonsData[activeTab];
                return (
                    <div className="container mx-auto px-4 py-8 max-w-6xl slide-up">
                        <button onClick={() => setView('intro')} className="mb-6 px-6 py-2 bg-slate-800 text-sky-400 rounded-lg border border-sky-900 hover:bg-slate-700 transition">
                            🔙 العودة للرئيسية
                        </button>
                        
                        <h2 className="text-4xl font-black text-center mb-8 text-sky-400 title-font">
                            غرفة عمليات المقارنات 🌍
                        </h2>

                        {/* Tabs */}
                        <div className="flex flex-wrap justify-center gap-2 mb-10">
                            {disorders.map(d => (
                                <button 
                                    key={d} 
                                    onClick={() => setActiveTab(d)}
                                    className={`px-6 py-3 rounded-full font-bold text-lg transition-all ${activeTab === d ? 'bg-sky-500 text-white shadow-[0_0_15px_rgba(56,189,248,0.6)]' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                >
                                    {d}
                                </button>
                            ))}
                        </div>

                        {/* Dashboard */}
                        <div className="fade-in">
                            {/* Countries */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                                <div className="bg-slate-900/90 border border-emerald-500/50 rounded-2xl p-6 shadow-[0_10px_30px_rgba(16,185,129,0.2)]">
                                    <h3 className="text-2xl font-black text-emerald-400 mb-6 border-b border-emerald-500/30 pb-3 text-center">4 دول عربية 🌴</h3>
                                    <ul className="space-y-4">
                                        {data.arab.map((item, i) => (
                                            <li key={i} className="bg-slate-800 p-4 rounded-xl border-r-4 border-emerald-500">
                                                <strong className="text-white text-lg block mb-1">{item.country}</strong>
                                                <span className="text-slate-300 text-sm leading-relaxed">{item.fact}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                                <div className="bg-slate-900/90 border border-sky-500/50 rounded-2xl p-6 shadow-[0_10px_30px_rgba(56,189,248,0.2)]">
                                    <h3 className="text-2xl font-black text-sky-400 mb-6 border-b border-sky-500/30 pb-3 text-center">4 دول أجنبية 🗽</h3>
                                    <ul className="space-y-4">
                                        {data.foreign.map((item, i) => (
                                            <li key={i} className="bg-slate-800 p-4 rounded-xl border-r-4 border-sky-500">
                                                <strong className="text-white text-lg block mb-1">{item.country}</strong>
                                                <span className="text-slate-300 text-sm leading-relaxed">{item.fact}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>

                            {/* Age Stages Timeline Component */}
                            <div className="bg-gradient-to-b from-slate-900 to-slate-950 border border-indigo-500/50 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
                                <h3 className="text-3xl font-black text-center text-white mb-10 title-font">مخطط الفروق العمرية والجنسية ⏳</h3>
                                
                                <div className="space-y-8">
                                    {data.stages.map((stage, idx) => (
                                        <div key={idx} className="relative">
                                            {/* Center Line for Desktop */}
                                            <div className="hidden md:block absolute left-1/2 top-0 bottom-0 w-1 bg-indigo-900/50 transform -translate-x-1/2 rounded-full"></div>
                                            
                                            {/* Phase Label */}
                                            <div className="flex justify-center mb-4 relative z-10">
                                                <div className="bg-indigo-600 px-6 py-2 rounded-full border-2 border-indigo-400 shadow-[0_0_15px_rgba(79,70,229,0.5)] flex items-center gap-3">
                                                    {stage.icon}
                                                    <span className="font-bold text-xl text-white">{stage.phase}</span>
                                                </div>
                                            </div>

                                            {/* Male/Female Comparison Boxes */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
                                                {/* Male Box (Right) */}
                                                <div className="bg-blue-900/20 border-r-4 border-blue-500 p-5 rounded-2xl md:text-left flex flex-col md:flex-row-reverse items-center md:items-start gap-4 hover:bg-blue-900/30 transition-colors">
                                                    <div className="text-4xl shrink-0">👨</div>
                                                    <div>
                                                        <h4 className="font-bold text-blue-400 mb-2 md:text-right text-center">الذكور</h4>
                                                        <p className="text-slate-300 text-sm leading-relaxed md:text-right text-center">{stage.male}</p>
                                                    </div>
                                                </div>

                                                {/* Female Box (Left) */}
                                                <div className="bg-pink-900/20 border-l-4 border-pink-500 p-5 rounded-2xl flex flex-col md:flex-row items-center md:items-start gap-4 hover:bg-pink-900/30 transition-colors">
                                                    <div className="text-4xl shrink-0">👩</div>
                                                    <div>
                                                        <h4 className="font-bold text-pink-400 mb-2 text-center md:text-left">الإناث</h4>
                                                        <p className="text-slate-300 text-sm leading-relaxed text-center md:text-left">{stage.female}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'games_hub') {
                return (
                    <div className="container mx-auto px-4 py-12 max-w-5xl slide-up">
                        <button onClick={() => setView('intro')} className="mb-6 px-6 py-2 bg-slate-800 text-sky-400 rounded-lg border border-sky-900 hover:bg-slate-700 transition">
                            🔙 العودة للرئيسية
                        </button>
                        
                        <h2 className="text-4xl font-black text-center mb-10 text-emerald-400 title-font">
                            أكاديمية الألعاب 🎮
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-slate-800 border-2 border-indigo-500/50 p-8 rounded-3xl hover:scale-105 transition-transform flex flex-col items-center text-center group">
                                <div className="text-6xl mb-4">⚔️</div>
                                <h3 className="text-2xl font-bold text-indigo-300 mb-3">تحدي الجنسين والأعمار</h3>
                                <p className="text-slate-400 mb-6 flex-1">من الأكثر عرضة في الطفولة؟ من في المراهقة؟ اختبر حفظك.</p>
                                <button onClick={() => startGame('gender')} className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-white flex justify-center">العب الآن</button>
                            </div>

                            <div className="bg-slate-800 border-2 border-emerald-500/50 p-8 rounded-3xl hover:scale-105 transition-transform flex flex-col items-center text-center group">
                                <div className="text-6xl mb-4">🌍</div>
                                <h3 className="text-2xl font-bold text-emerald-300 mb-3">تحدي الدول</h3>
                                <p className="text-slate-400 mb-6 flex-1">طابق المعلومة الإحصائية بالدولة الصحيحة (عربية وأجنبية).</p>
                                <button onClick={() => startGame('country')} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white flex justify-center">العب الآن</button>
                            </div>

                            <div className="bg-slate-800 border-2 border-orange-500/50 p-8 rounded-3xl hover:scale-105 transition-transform flex flex-col items-center text-center group">
                                <div className="text-6xl mb-4">⚡</div>
                                <h3 className="text-2xl font-bold text-orange-300 mb-3">صح أم خطأ؟</h3>
                                <p className="text-slate-400 mb-6 flex-1">أسئلة سريعة مختلطة تقيس دقة تركيزك في تفاصيل المقارنات.</p>
                                <button onClick={() => startGame('tf')} className="w-full py-3 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold text-white flex justify-center">العب الآن</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'game') {
                const currentQuestions = getActiveQuestionsList();
                const q = currentQuestions[gameQIndex];
                const themeColor = gameType === 'gender' ? 'indigo' : (gameType === 'country' ? 'emerald' : 'orange');

                return (
                    <div className="container mx-auto px-4 py-12 max-w-4xl slide-up text-center">
                        <div className={`flex justify-between items-center mb-10 bg-slate-800 p-4 rounded-xl border border-${themeColor}-700`}>
                            <button onClick={() => setView('games_hub')} className="text-slate-400 hover:text-white">🔙 خروج</button>
                            <span className={`text-${themeColor}-400 font-bold`}>السؤال {gameQIndex + 1} / {currentQuestions.length}</span>
                            <span className="text-emerald-400 font-bold">النقاط: {gameScore}</span>
                        </div>

                        <div className={`bg-slate-900 p-8 md:p-12 rounded-[2rem] border border-${themeColor}-500/30 shadow-2xl mb-10`}>
                            <h2 className="text-2xl md:text-3xl font-black text-white leading-loose mb-12">"{q.text}"</h2>
                            
                            {gameType === 'gender' && (
                                <div className="flex flex-col sm:flex-row gap-8 justify-center">
                                    <button onClick={() => handleAnswerClick('male')} className="flex-1 bg-slate-800 hover:bg-blue-900/50 border-2 border-blue-500/50 p-6 rounded-3xl transition-transform hover:scale-105">
                                        <MaleIcon />
                                        <span className="text-2xl font-black text-blue-400 block mt-2">الذكور 👨</span>
                                    </button>
                                    <button onClick={() => handleAnswerClick('female')} className="flex-1 bg-slate-800 hover:bg-pink-900/50 border-2 border-pink-500/50 p-6 rounded-3xl transition-transform hover:scale-105">
                                        <FemaleIcon />
                                        <span className="text-2xl font-black text-pink-400 block mt-2">الإناث 👩</span>
                                    </button>
                                </div>
                            )}

                            {gameType === 'country' && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {q.options.map((opt, idx) => (
                                        <button key={idx} onClick={() => handleAnswerClick(opt)} className="py-5 text-xl font-bold bg-slate-800 hover:bg-emerald-600 border-2 border-slate-600 hover:border-emerald-400 rounded-xl text-white transition-colors">
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {gameType === 'tf' && (
                                <div className="flex flex-col sm:flex-row gap-6 justify-center">
                                    <button onClick={() => handleAnswerClick(true)} className="flex-1 py-6 text-2xl font-bold bg-emerald-900/40 hover:bg-emerald-600 border-2 border-emerald-500/50 rounded-2xl text-emerald-300 hover:text-white transition-colors">
                                        صح ✅
                                    </button>
                                    <button onClick={() => handleAnswerClick(false)} className="flex-1 py-6 text-2xl font-bold bg-rose-900/40 hover:bg-rose-600 border-2 border-rose-500/50 rounded-2xl text-rose-300 hover:text-white transition-colors">
                                        خطأ ❌
                                    </button>
                                </div>
                            )}
                        </div>

                        {gameModal && (
                            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 p-10 rounded-[2rem] border-2 max-w-lg w-full text-center bounce-in" style={{ borderColor: gameModal.isCorrect ? '#34d399' : '#fb7185' }}>
                                    <div className="text-7xl mb-4">{gameModal.isCorrect ? '🎯' : '❌'}</div>
                                    <h3 className={`text-3xl font-black mb-6 ${gameModal.isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>{gameModal.title}</h3>
                                    {!gameModal.isCorrect && (
                                        <div className="mb-8 p-4 bg-rose-950/50 rounded-xl border border-rose-500/30">
                                            <p className="text-slate-300 mb-2">الإجابة الصحيحة هي:</p>
                                            <p className="text-xl font-bold text-white whitespace-pre-wrap">{gameModal.correctText}</p>
                                        </div>
                                    )}
                                    <button onClick={nextGameQ} className={`w-full py-4 text-slate-900 rounded-xl font-black text-xl transition-colors ${gameModal.isCorrect ? 'bg-emerald-400 hover:bg-emerald-300' : 'bg-slate-200 hover:bg-white'}`}>
                                        التالي ⏭️
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'game_result') {
                return (
                    <div className="container mx-auto px-4 py-16 text-center slide-up flex justify-center items-center min-h-screen">
                        <div className="bg-slate-800 p-12 rounded-[2rem] border border-sky-500/50 max-w-2xl w-full shadow-2xl">
                            <div className="text-7xl mb-6">🏆</div>
                            <h2 className="text-4xl font-black text-white mb-6">انتهى التحدي!</h2>
                            <p className="text-2xl text-slate-300 mb-10">جاوبت صح على <span className="text-emerald-400 font-bold">{gameScore}</span> من <span className="text-sky-400 font-bold">{getActiveQuestionsList().length}</span></p>
                            <div className="flex flex-col sm:flex-row gap-4">
                                <button onClick={() => setView('games_hub')} className="flex-1 py-4 bg-sky-600 hover:bg-sky-500 rounded-xl font-bold text-xl text-white">العودة للألعاب</button>
                                <button onClick={() => setView('intro')} className="flex-1 py-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-xl text-white">الرئيسية</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Footer -->
    <div class="fixed bottom-0 w-full bg-slate-950 border-t border-sky-900/50 p-3 z-40 overflow-hidden shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
        <div class="absolute inset-0 stars-bg opacity-30"></div>
        <p class="relative text-center text-sky-400 font-black text-lg drop-shadow-[0_0_8px_rgba(56,189,248,0.8)] title-font">
            ✨ إعداد: مجدي عبد البصير ✨
        </p>
    </div>
</body>
</html>
