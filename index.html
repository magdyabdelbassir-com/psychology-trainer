            { text: "في مرحلة الطفولة: من يبدأ لديه الوسواس القهري أبكر (25% قبل العاشرة) مقترناً باللزمات الحركية؟", answer: "male" },
            { text: "في البلوغ: من لديه ذروة ثانية لظهور الفصام بعد سن الأربعين (حول انقطاع الطمث)؟", answer: "female" },
            { text: "في المراهقة: من يميل لظهور نوبات الهوس الصريح (النوع الأول) في ثنائي القطب كأول نوبة؟", answer: "male" },
            { text: "في الطفولة: تظهر الاندفاعية لديهم مبكراً كاضطرابات مسلك وقسوة مع الحيوانات؟", answer: "male" },
            { text: "في البلوغ: الوسواس القهري يزداد لديهم، ويظهر بوضوح في فترات الحمل وما بعد الولادة خوفاً على الطفل؟", answer: "female" },
            { text: "في المراهقة: يميلون لاندفاعات موجهة للذات كـ (هوس نتف الشعر) بدلاً من التخريب الخارجي؟", answer: "female" },
            { text: "في البلوغ: ثنائي القطب يتزامن لديهم بقوة مع إدمان الكحوليات بنسبة تصل لـ 50%؟", answer: "male" },
            { text: "في الشباب: الفصام يبدأ لديهم متأخراً (25-35 سنة) وتكون استجابتهم للأدوية أفضل؟", answer: "female" },
            { text: "في البلوغ: من يميلون أكثر بكثير لـ (هوس السرقة) كاستجابة قهرية لتخفيف التوتر والاكتئاب وليس للحاجة المادية؟", answer: "female" },
            { text: "في الشباب: الفصام لديهم يترافق مع أعراض سلبية شديدة وتدهور حاد في الأداء ما قبل المرض؟", answer: "male" },
            { text: "في البلوغ: الإناث أكثر عرضة لنمط (التكرار السريع Rapid Cycling) في ثنائي القطب بواقع 4 نوبات أو أكثر سنوياً؟", answer: "female" },
            { text: "في البلوغ وكبار السن: من تتسبب اندفاعاتهم (العدوان والمقامرة) في إلقائهم بالسجون الجنائية بدلاً من المستشفيات؟", answer: "male" }
        ];

        // Game 2: Country Maps
        const countryGameQuestions = [
            { text: "معدل 1.29 لكل 10,000 كحدوث سنوي لجميع الأعمار (طيف الفصام)", options: ["مصر", "الإمارات (العين)", "لبنان", "البحرين"], answer: "البحرين" },
            { text: "أطول تأخر في العلاج (DUP) يصل لـ 148.7 أسبوع مع نسبة ذهان 5.6%", options: ["قطر", "لبنان", "المغرب", "مصر"], answer: "المغرب" },
            { text: "الذهان الشبيه بالفصام شكل 35.6% من إجمالي حالات الذهان الحاد العابر (ATPD)", options: ["قطر", "لبنان", "المغرب العربي", "البحرين"], answer: "قطر" },
            { text: "معدل انتشار مجتمعي للفصام بلغ 0.7% متساوٍ بين الجنسين بالمدينة", options: ["مصر", "الإمارات (العين)", "قطر", "السعودية"], answer: "الإمارات (العين)" },
            { text: "تصل نسبة الفصام إلى 3% وهي من أعلى النسب عالمياً لدقة التسجيل والصراحة", options: ["الصين", "أمريكا", "السويد", "بريطانيا"], answer: "السويد" },
            { text: "نسبة الفصام 1-1.5% وتشكل عبئاً اقتصادياً باهظاً تصل تكلفته لـ 100 مليار دولار", options: ["بريطانيا", "أمريكا", "كندا", "السويد"], answer: "أمريكا" },
            { text: "رُصد سلوك تكرار بسيط بنسبة 10-15% بين طلاب الجامعات الأسوياء (وسواس قهري)", options: ["مصر", "قطر/البحرين", "لبنان", "الإمارات"], answer: "قطر/البحرين" },
            { text: "سُجل أعلى معدل لاضطرابات الذهان مدى الحياة بنسبة 25.8% بسبب النزوح والحروب", options: ["المغرب", "فلسطين", "لبنان", "العراق"], answer: "لبنان" },
            { text: "ترتفع نسبة الفصام في الطبقات الاجتماعية الدنيا بسبب (الانجراف الاجتماعي Social Drift)", options: ["أمريكا", "السويد", "بريطانيا وأوروبا", "الصين"], answer: "بريطانيا وأوروبا" },
            { text: "هوس نتف الشعر (Trichotillomania) يمثل 2% من الجمهور العام كشريحة عريضة", options: ["مصر", "كندا", "أمريكا", "لبنان"], answer: "كندا" }
        ];

        // Game 3: True / False
        const tfGameQuestions = [
            { text: "الذكور يبدأ لديهم الوسواس القهري في الطفولة أبكر من الإناث بحوالي 25% قبل العاشرة ويترافق مع اللزمات (Tics).", answer: true, explanation: "إجابة دقيقة وصحيحة." },
            { text: "في ثنائي القطب، تعاني الإناث في مرحلة البلوغ من نوبات هوس عنيفة تدفعهن للإدمان الكحولي أكثر من الذكور.", answer: false, explanation: "خطأ. الإناث يملن لثنائي القطب II مع اكتئاب أطول وتكرار سريع، والذكور هم الأكثر ارتباطاً بالإدمان الكحولي للسيطرة على الهوس." },
            { text: "الإناث أكثر عرضة بكثير للإصابة بالفصام في مرحلة الطفولة مقارنة بالذكور.", answer: false, explanation: "خطأ. الفصام في الطفولة نادر جداً للطرفين، لكنه إن حدث يميل بقوة للذكور." },
            { text: "نوبات العدوان الفجائي والمقامرة المرضية في مرحلة الشباب والبلوغ تميل بكثافة نحو الذكور وتلقي بهم في السجون.", answer: true, explanation: "صحيح، الاندفاعيات العنيفة والمخاطرة ذكورية بالأساس." },
            { text: "في مصر، معظم مرضى الوسواس القهري المترددين على العيادات هم من كبار السن فوق 60 عاماً.", answer: false, explanation: "خطأ. معظم المترددين على العيادات المصرية من الشباب في المرحلة العمرية (20-30 سنة)." },
            { text: "هوس السرقة (Kleptomania) في مرحلة البلوغ منتشر بين الإناث بهدف تلبية احتياجات مادية ملحة وشراء أغراض غالية.", answer: false, explanation: "خطأ. الإناث يسرقن أشياء ليس لها قيمة مادية كاستجابة قهرية لتفريغ وتخفيف التوتر، القلق، والاكتئاب." },
            { text: "نسبة الفصام الكلية بين الذكور والإناث مدى الحياة هي نسبة متقاربة ومتساوية تقريباً (1:1).", answer: true, explanation: "صحيح تماماً، الاختلاف يكمن فقط في (سن البداية) و (شكل الأعراض)، لكن النسبة الكلية متساوية." }
        ];

        // --- App Component ---
        const App = () => {
            const [view, setView] = useState('intro'); // intro, assignment, games_hub, game, game_result
            const [activeTab, setActiveTab] = useState("طيف الفصام");
            
            // Game State
            const [gameType, setGameType] = useState(''); 
            const [gameQIndex, setGameQIndex] = useState(0);
            const [gameScore, setGameScore] = useState(0);
            const [gameModal, setGameModal] = useState(null);

            const disorders = Object.keys(comparisonsData);

            const startGame = (type) => {
                setGameType(type);
                setGameQIndex(0);
                setGameScore(0);
                setGameModal(null);
                setView('game');
            };

            const getActiveQuestionsList = () => {
                if (gameType === 'gender') return genderGameQuestions;
                if (gameType === 'country') return countryGameQuestions;
                if (gameType === 'tf') return tfGameQuestions;
                return [];
            };

            const handleAnswerClick = (selectedAnswer) => {
                const currentQuestions = getActiveQuestionsList();
                const currentQ = currentQuestions[gameQIndex];
                const isCorrect = selectedAnswer === currentQ.answer;
                
                if (isCorrect) setGameScore(prev => prev + 1);

                let correctAnswerText = "";
                if (gameType === 'gender') correctAnswerText = currentQ.answer === 'male' ? "الذكور 👨" : "الإناث 👩";
                else if (gameType === 'country') correctAnswerText = currentQ.answer;
                else if (gameType === 'tf') correctAnswerText = (currentQ.answer ? "صح ✅" : "خطأ ❌") + (currentQ.explanation ? `\n\n💡 التعليل:\n${currentQ.explanation}` : "");

                setGameModal({
                    isCorrect,
                    title: isCorrect ? "وحش المذاكرة! 🥇" : "إجابة من المريخ! 🤡",
                    correctText: correctAnswerText
                });
            };

            const nextGameQ = () => {
                setGameModal(null);
                const totalQ = getActiveQuestionsList().length;
                if (gameQIndex + 1 < totalQ) {
                    setGameQIndex(prev => prev + 1);
                } else {
                    setView('game_result');
                }
            };

            // --- Views ---
            if (view === 'intro') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen text-center px-4 fade-in">
                        <div className="mb-6 pulse-glow rounded-full p-2 bg-sky-900/30">
                            <BrainIcon />
                        </div>
                        <h1 className="text-5xl md:text-7xl font-black title-font text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400 mb-6 drop-shadow-lg">
                            الموسوعة الشاملة
                        </h1>
                        <p className="text-xl md:text-2xl text-slate-300 max-w-3xl leading-relaxed mb-10">
                            (النسخة الاحترافية) تم تفريغ <strong className="text-pink-400">كل كلمة ذُكرت بالمنهج</strong> عن الدول والفروق العمرية والجنسية حرفياً، بدون حذف أو اختصار لأي معلومة.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-6 w-full max-w-2xl">
                            <button onClick={() => setView('assignment')} className="flex-1 py-5 bg-gradient-to-l from-indigo-600 to-purple-600 hover:scale-105 rounded-2xl font-bold text-xl transition-transform shadow-[0_10px_30px_rgba(79,70,229,0.5)] border-2 border-indigo-400">
                                <CompareIcon /> المقارنة التفصيلية <br/><span className="text-sm font-normal">(اقرأ المنهج كاملاً هنا)</span>
                            </button>
                            <button onClick={() => setView('games_hub')} className="flex-1 py-5 bg-slate-800 border-2 border-emerald-500 hover:bg-slate-700 rounded-2xl font-bold text-xl transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)]">
                                <TargetIcon /> أكاديمية الألعاب <br/><span className="text-sm font-normal">(اختبر الحفظ للشفوي)</span>
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'assignment') {
                const data = comparisonsData[activeTab];
                return (
                    <div className="container mx-auto px-4 py-8 max-w-6xl slide-up">
                        <button onClick={() => setView('intro')} className="mb-6 px-6 py-2 bg-slate-800 text-sky-400 rounded-lg border border-sky-900 hover:bg-slate-700 transition shadow-lg">
                            🔙 العودة للرئيسية
                        </button>
                        
                        <h2 className="text-4xl font-black text-center mb-8 text-sky-400 title-font drop-shadow-lg">
                            المقارنة الشاملة (بدون حذف) 🌍
                        </h2>

                        {/* Tabs */}
                        <div className="flex flex-wrap justify-center gap-3 mb-10">
                            {disorders.map(d => (
                                <button 
                                    key={d} 
                                    onClick={() => setActiveTab(d)}
                                    className={`px-8 py-3 rounded-full font-bold text-lg transition-all ${activeTab === d ? 'bg-sky-500 text-white shadow-[0_0_20px_rgba(56,189,248,0.7)] scale-105' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 border border-slate-700'}`}
                                >
                                    {d}
                                </button>
                            ))}
                        </div>

                        {/* Dashboard */}
                        <div className="fade-in space-y-10">
                            {/* Countries Compare */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {/* Arab Card (Scrollable) */}
                                <div className="bg-slate-900 border border-emerald-500/50 rounded-2xl p-6 shadow-[0_10px_40px_rgba(16,185,129,0.2)] flex flex-col h-[500px]">
                                    <h3 className="text-2xl font-black text-emerald-400 mb-4 border-b border-emerald-500/30 pb-3 text-center shrink-0">كل الدول العربية المذكورة 🌴</h3>
                                    <ul className="space-y-4 overflow-y-auto inner-scroll pr-3 pb-2">
                                        {data.arab.map((item, i) => (
                                            <li key={i} className="bg-slate-800 p-4 rounded-xl border-r-4 border-emerald-500 shadow-md">
                                                <strong className="text-white text-lg block mb-2">{item.country}</strong>
                                                <span className="text-slate-300 text-base leading-relaxed block">{item.fact}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                                {/* Foreign Card (Scrollable) */}
                                <div className="bg-slate-900 border border-sky-500/50 rounded-2xl p-6 shadow-[0_10px_40px_rgba(56,189,248,0.2)] flex flex-col h-[500px]">
                                    <h3 className="text-2xl font-black text-sky-400 mb-4 border-b border-sky-500/30 pb-3 text-center shrink-0">كل الدول الأجنبية والعالم 🗽</h3>
                                    <ul className="space-y-4 overflow-y-auto inner-scroll pr-3 pb-2">
                                        {data.foreign.map((item, i) => (
                                            <li key={i} className="bg-slate-800 p-4 rounded-xl border-r-4 border-sky-500 shadow-md">
                                                <strong className="text-white text-lg block mb-2">{item.country}</strong>
                                                <span className="text-slate-300 text-base leading-relaxed block">{item.fact}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>

                            {/* Detailed Age/Gender Stages Component */}
                            <div className="bg-gradient-to-b from-slate-900 to-slate-950 border border-indigo-500/50 rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
                                <h3 className="text-3xl font-black text-center text-white mb-12 title-font">التفصيل الشامل: الفروق العمرية والجنسية ⏳</h3>
                                
                                <div className="space-y-12">
                                    {data.stages.map((stage, idx) => (
                                        <div key={idx} className="relative">
                                            {/* Center Line for Desktop */}
                                            <div className="hidden lg:block absolute left-1/2 top-0 bottom-0 w-1 bg-indigo-900/50 transform -translate-x-1/2 rounded-full"></div>
                                            
                                            {/* Phase Label */}
                                            <div className="flex justify-center mb-6 relative z-10">
                                                <div className="bg-indigo-600 px-8 py-3 rounded-full border-2 border-indigo-400 shadow-[0_0_20px_rgba(79,70,229,0.5)] flex items-center gap-3">
                                                    {stage.icon}
                                                    <span className="font-black text-2xl text-white">{stage.phase}</span>
                                                </div>
                                            </div>

                                            {/* Male/Female Comparison Boxes */}
                                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 relative z-10">
                                                {/* Male Box (Right) */}
                                                <div className="bg-blue-900/20 border-t-4 lg:border-t-0 lg:border-r-4 border-blue-500 p-6 rounded-2xl flex flex-col lg:flex-row-reverse items-center lg:items-start gap-6 hover:bg-blue-900/30 transition-colors shadow-lg">
                                                    <div className="text-5xl shrink-0 p-3 bg-slate-900/50 rounded-full border border-blue-500/30">👨</div>
                                                    <div className="w-full">
                                                        <h4 className="font-black text-xl text-blue-400 mb-4 lg:text-right text-center border-b border-blue-900 pb-2">الذكور</h4>
                                                        <p className="text-slate-300 text-base leading-loose lg:text-right text-right whitespace-pre-line">{stage.male}</p>
                                                    </div>
                                                </div>

                                                {/* Female Box (Left) */}
                                                <div className="bg-pink-900/20 border-t-4 lg:border-t-0 lg:border-l-4 border-pink-500 p-6 rounded-2xl flex flex-col lg:flex-row items-center lg:items-start gap-6 hover:bg-pink-900/30 transition-colors shadow-lg">
                                                    <div className="text-5xl shrink-0 p-3 bg-slate-900/50 rounded-full border border-pink-500/30">👩</div>
                                                    <div className="w-full">
                                                        <h4 className="font-black text-xl text-pink-400 mb-4 text-center lg:text-left border-b border-pink-900 pb-2">الإناث</h4>
                                                        <p className="text-slate-300 text-base leading-loose text-right lg:text-left whitespace-pre-line" dir="rtl">{stage.female}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'games_hub') {
                return (
                    <div className="container mx-auto px-4 py-12 max-w-6xl slide-up">
                        <button onClick={() => setView('intro')} className="mb-6 px-6 py-2 bg-slate-800 text-sky-400 rounded-lg border border-sky-900 hover:bg-slate-700 transition">
                            🔙 العودة للرئيسية
                        </button>
                        
                        <h2 className="text-4xl font-black text-center mb-10 text-emerald-400 title-font drop-shadow-lg">
                            أكاديمية الألعاب الشاملة 🎮
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="bg-slate-800 border-2 border-indigo-500/50 p-8 rounded-3xl hover:-translate-y-2 transition-all flex flex-col items-center text-center group shadow-xl">
                                <div className="text-7xl mb-6">⚔️</div>
                                <h3 className="text-2xl font-black text-indigo-300 mb-4">تحدي الجنسين والأعمار</h3>
                                <p className="text-slate-400 mb-8 flex-1 leading-relaxed">الأسئلة تم تحديثها لتشمل أدق التفاصيل في المنهج عن الطفولة والمراهقة والبلوغ.</p>
                                <button onClick={() => startGame('gender')} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xl text-white shadow-[0_5px_15px_rgba(79,70,229,0.4)]">العب الآن</button>
                            </div>

                            <div className="bg-slate-800 border-2 border-emerald-500/50 p-8 rounded-3xl hover:-translate-y-2 transition-all flex flex-col items-center text-center group shadow-xl">
                                <div className="text-7xl mb-6">🌍</div>
                                <h3 className="text-2xl font-black text-emerald-300 mb-4">تحدي كافة الدول</h3>
                                <p className="text-slate-400 mb-8 flex-1 leading-relaxed">طابق المعلومة الإحصائية الدقيقة جداً بالدولة الصحيحة (عربية وأجنبية وعالمية).</p>
                                <button onClick={() => startGame('country')} className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-xl text-white shadow-[0_5px_15px_rgba(16,185,129,0.4)]">العب الآن</button>
                            </div>

                            <div className="bg-slate-800 border-2 border-orange-500/50 p-8 rounded-3xl hover:-translate-y-2 transition-all flex flex-col items-center text-center group shadow-xl">
                                <div className="text-7xl mb-6">⚡</div>
                                <h3 className="text-2xl font-black text-orange-300 mb-4">صح أم خطأ؟ (بالتعليل)</h3>
                                <p className="text-slate-400 mb-8 flex-1 leading-relaxed">أسئلة فخوخ سريعة تقيس دقة تركيزك مع ظهور التعليل بعد الإجابة.</p>
                                <button onClick={() => startGame('tf')} className="w-full py-4 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold text-xl text-white shadow-[0_5px_15px_rgba(249,115,22,0.4)]">العب الآن</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'game') {
                const currentQuestions = getActiveQuestionsList();
                const q = currentQuestions[gameQIndex];
                const themeColor = gameType === 'gender' ? 'indigo' : (gameType === 'country' ? 'emerald' : 'orange');

                return (
                    <div className="container mx-auto px-4 py-12 max-w-4xl slide-up text-center">
                        <div className={`flex justify-between items-center mb-10 bg-slate-800 p-5 rounded-2xl border border-${themeColor}-700 shadow-lg`}>
                            <button onClick={() => setView('games_hub')} className="text-slate-400 hover:text-white font-bold">🔙 خروج</button>
                            <span className={`text-${themeColor}-400 font-black text-lg`}>السؤال {gameQIndex + 1} من {currentQuestions.length}</span>
                            <span className="text-emerald-400 font-black text-lg bg-emerald-900/30 px-4 py-1 rounded-full">النقاط: {gameScore}</span>
                        </div>

                        <div className={`bg-slate-900 p-8 md:p-14 rounded-[2.5rem] border-2 border-${themeColor}-500/30 shadow-[0_0_50px_rgba(0,0,0,0.5)] mb-10`}>
                            <h2 className="text-2xl md:text-4xl font-black text-white leading-loose mb-14 drop-shadow-md">"{q.text}"</h2>
                            
                            {gameType === 'gender' && (
                                <div className="flex flex-col sm:flex-row gap-8 justify-center">
                                    <button onClick={() => handleAnswerClick('male')} className="flex-1 bg-slate-800 hover:bg-blue-900/50 border-2 border-blue-500/50 p-8 rounded-[2rem] transition-transform hover:scale-105 shadow-xl group">
                                        <div className="text-6xl mb-4 group-hover:-translate-y-2 transition-transform">👨</div>
                                        <span className="text-3xl font-black text-blue-400 block mt-2">الذكور</span>
                                    </button>
                                    <button onClick={() => handleAnswerClick('female')} className="flex-1 bg-slate-800 hover:bg-pink-900/50 border-2 border-pink-500/50 p-8 rounded-[2rem] transition-transform hover:scale-105 shadow-xl group">
                                        <div className="text-6xl mb-4 group-hover:-translate-y-2 transition-transform">👩</div>
                                        <span className="text-3xl font-black text-pink-400 block mt-2">الإناث</span>
                                    </button>
                                </div>
                            )}

                            {gameType === 'country' && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    {q.options.map((opt, idx) => (
                                        <button key={idx} onClick={() => handleAnswerClick(opt)} className="py-6 px-4 text-xl md:text-2xl font-bold bg-slate-800 hover:bg-emerald-600 border-2 border-slate-600 hover:border-emerald-400 rounded-2xl text-white transition-colors shadow-lg">
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {gameType === 'tf' && (
                                <div className="flex flex-col sm:flex-row gap-8 justify-center">
                                    <button onClick={() => handleAnswerClick(true)} className="flex-1 py-8 text-3xl font-black bg-emerald-900/40 hover:bg-emerald-600 border-2 border-emerald-500/50 rounded-[2rem] text-emerald-300 hover:text-white transition-colors shadow-xl">
                                        صح ✅
                                    </button>
                                    <button onClick={() => handleAnswerClick(false)} className="flex-1 py-8 text-3xl font-black bg-rose-900/40 hover:bg-rose-600 border-2 border-rose-500/50 rounded-[2rem] text-rose-300 hover:text-white transition-colors shadow-xl">
                                        خطأ ❌
                                    </button>
                                </div>
                            )}
                        </div>

                        {gameModal && (
                            <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 p-10 md:p-14 rounded-[3rem] border-2 max-w-2xl w-full text-center bounce-in shadow-[0_0_80px_rgba(0,0,0,0.8)]" style={{ borderColor: gameModal.isCorrect ? '#34d399' : '#fb7185' }}>
                                    <div className="text-8xl mb-6 drop-shadow-xl">{gameModal.isCorrect ? '🎯' : '❌'}</div>
                                    <h3 className={`text-4xl font-black mb-8 ${gameModal.isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>{gameModal.title}</h3>
                                    
                                    {!gameModal.isCorrect && (
                                        <div className="mb-8 p-6 bg-slate-800 rounded-2xl border border-slate-600">
                                            <p className="text-slate-400 mb-3 text-lg">الإجابة الصحيحة والتعليل:</p>
                                            <p className="text-2xl font-bold text-white whitespace-pre-line leading-relaxed">{gameModal.correctText}</p>
                                        </div>
                                    )}
                                    
                                    {gameModal.isCorrect && gameType === 'tf' && gameModal.correctText.includes('💡') && (
                                         <div className="mb-8 p-6 bg-slate-800 rounded-2xl border border-slate-600">
                                            <p className="text-2xl font-bold text-white whitespace-pre-line leading-relaxed">{gameModal.correctText.replace('صح ✅\n\n', '')}</p>
                                        </div>
                                    )}

                                    <button onClick={nextGameQ} className={`w-full py-5 text-slate-900 rounded-2xl font-black text-2xl transition-colors shadow-lg ${gameModal.isCorrect ? 'bg-emerald-400 hover:bg-emerald-300' : 'bg-slate-200 hover:bg-white'}`}>
                                        السؤال التالي ⏭️
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'game_result') {
                return (
                    <div className="container mx-auto px-4 py-16 text-center slide-up flex justify-center items-center min-h-screen">
                        <div className="bg-slate-800 p-14 rounded-[3rem] border-2 border-sky-500/50 max-w-2xl w-full shadow-[0_0_60px_rgba(14,165,233,0.3)]">
                            <div className="text-8xl mb-8 drop-shadow-lg">🏆</div>
                            <h2 className="text-5xl font-black text-white mb-8">انتهى التحدي!</h2>
                            <p className="text-3xl text-slate-300 mb-12 bg-slate-900/50 p-6 rounded-2xl border border-slate-700">جاوبت صح على <span className="text-emerald-400 font-black text-4xl">{gameScore}</span> من <span className="text-sky-400 font-black text-4xl">{getActiveQuestionsList().length}</span></p>
                            <div className="flex flex-col sm:flex-row gap-6">
                                <button onClick={() => setView('games_hub')} className="flex-1 py-5 bg-sky-600 hover:bg-sky-500 rounded-2xl font-black text-xl text-white shadow-xl hover:-translate-y-1 transition-transform">العودة للألعاب</button>
                                <button onClick={() => setView('intro')} className="flex-1 py-5 bg-slate-700 hover:bg-slate-600 rounded-2xl font-black text-xl text-white shadow-xl hover:-translate-y-1 transition-transform">الرئيسية</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Footer -->
    <div class="fixed bottom-0 w-full bg-slate-950 border-t border-sky-900/50 p-3 z-40 overflow-hidden shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
        <div class="absolute inset-0 stars-bg opacity-30"></div>
        <p class="relative text-center text-sky-400 font-black text-lg drop-shadow-[0_0_8px_rgba(56,189,248,0.8)] title-font">
            ✨ إعداد: مجدي عبد البصير ✨
        </p>
    </div>
</body>
</html>
