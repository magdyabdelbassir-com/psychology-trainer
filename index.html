        function App() {
            const [user, setUser] = useState(null);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [activeChapter, setActiveChapter] = useState(1);
            const [userAnswer, setUserAnswer] = useState("");
            const [feedback, setFeedback] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [cloudProgress, setCloudProgress] = useState({});
            const [comic, setComic] = useState("");
            const scrollRef = useRef(null);

            // المصادقة وتتبع الحالة (Rule 3)
            useEffect(() => {
                const initAuth = async () => {
                    if (!auth) return;
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (e) { console.log("Auth System Initializing..."); }
                };
                initAuth();
                const unsubscribe = auth ? auth.onAuthStateChanged(setUser) : () => {};
                return () => unsubscribe();
            }, []);

            // مزامنة البيانات السحابية (Rule 1)
            useEffect(() => {
                if (!user || !db) return;
                const progressRef = db.doc(`artifacts/${appId}/users/${user.uid}/progress/data`);
                const unsubscribe = progressRef.onSnapshot((doc) => {
                    if (doc.exists) setCloudProgress(doc.data().answers || {});
                }, (err) => console.log("Waiting for stable connection..."));
                return () => unsubscribe();
            }, [user]);

            const saveToCloud = async (qId, status, explanation, text) => {
                if (!user || !db) return;
                const progressRef = db.doc(`artifacts/${appId}/users/${user.uid}/progress/data`);
                const updated = { ...cloudProgress, [qId]: { status, explanation, text, ts: Date.now() } };
                await progressRef.set({ answers: updated }, { merge: true });
            };

            // وظيفة التقييم المحسنة مع نظام الـ Retry والفلترة الذكية
            const evaluate = async () => {
                if (!userAnswer.trim() || isLoading) return;
                setIsLoading(true);
                setFeedback(null);

                const currentQ = QUESTIONS[currentIdx];
                const systemPrompt = `أنت أستاذ مناهج بحث علمي مصري فكاهي. قيم إجابة الطالب بمرونة تامة. اقبل العامية المصرية. ركز على جوهر المعنى. رد بصيغة JSON فقط دون أي نصوص إضافية: {"status": "correct|partial|wrong", "explanation": "شرح مصري فكاهي قصير"}`;
                const userPrompt = `السؤال: ${currentQ.question}\nالإجابة النموذجية: ${currentQ.modelAnswer}\nإجابة الطالب: ${userAnswer}`;

                // نظام المحاولات المتكررة (Exponential Backoff)
                const callAPI = async (retries = 5) => {
                    const delays = [1000, 2000, 4000, 8000, 16000];
                    for (let i = 0; i < retries; i++) {
                        try {
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: userPrompt }] }],
                                    systemInstruction: { parts: [{ text: systemPrompt }] },
                                    generationConfig: { 
                                        responseMimeType: "application/json", 
                                        maxOutputTokens: 1000,
                                        temperature: 0.2 // تقليل درجة الحرارة لزيادة استقرار الـ JSON
                                    }
                                })
                            });
                            if (!res.ok) throw new Error();
                            return await res.json();
                        } catch (e) {
                            if (i === retries - 1) throw e;
                            await new Promise(r => setTimeout(r, delays[i]));
                        }
                    }
                };

                try {
                    const data = await callAPI();
                    const raw = data.candidates[0].content.parts[0].text;
                    
                    // استخراج الـ JSON بشكل آمن حتى لو وجد نصوص زائدة
                    const jsonMatch = raw.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error();
                    const result = JSON.parse(jsonMatch[0]);

                    const list = result.status === 'wrong' ? FAIL_COMICS : SUCCESS_COMICS;
                    setComic(list[Math.floor(Math.random() * list.length)]);
                    setFeedback(result);
                    await saveToCloud(currentQ.id, result.status, result.explanation, userAnswer);
                    
                    setTimeout(() => scrollRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                } catch (e) {
                    setFeedback({ status: "error", explanation: "يا بطل النت فيه مشكلة أو السيستم مهنج شوية.. دوس على الزرار تاني كدة." });
                } finally {
                    setIsLoading(false);
                }
            };

            const currentQ = QUESTIONS[currentIdx];
            const savedProgress = cloudProgress[currentQ.id];

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 pb-12" dir="rtl">
                    <header className="glass-header sticky top-0 z-50 p-4">
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-4">
                                <div className="bg-indigo-600 p-3 rounded-2xl text-white shadow-lg shadow-indigo-200">🧠</div>
                                <div>
                                    <h1 className="text-xl font-black tracking-tight">مدرب مناهج البحث الذكي</h1>
                                    <p className="text-xs text-indigo-500 font-bold italic">إعداد: مجدي عبد البصير</p>
                                </div>
                            </div>
                            <div className="flex gap-4 bg-white px-6 py-2 rounded-2xl border shadow-sm">
                                <div className="text-center"><span className="block text-[8px] font-black text-slate-400">المحلول</span><span className="font-black text-indigo-600">{Object.keys(cloudProgress).length} / 50</span></div>
                                <div className="w-[1px] bg-slate-200 mx-2"></div>
                                <div className="text-center"><span className="block text-[8px] font-black text-slate-400 uppercase tracking-widest">صح</span><span className="font-black text-emerald-500">{Object.values(cloudProgress).filter(v => v.status === 'correct').length}</span></div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <aside className="lg:col-span-4 space-y-6">
                            <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-200">
                                <div className="flex gap-2 mb-6 p-1 bg-slate-100 rounded-2xl border">
                                    <button onClick={() => setActiveChapter(1)} className={`flex-1 py-3 rounded-xl font-black text-sm transition-all ${activeChapter === 1 ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>الفصل الأول</button>
                                    <button onClick={() => setActiveChapter(2)} className={`flex-1 py-3 rounded-xl font-black text-sm transition-all ${activeChapter === 2 ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>الفصل الثاني</button>
                                </div>
                                <div className="grid grid-cols-5 gap-3 max-h-[450px] overflow-y-auto p-2 custom-scrollbar">
                                    {QUESTIONS.map((q, i) => {
                                        if (q.ch !== activeChapter) return null;
                                        const state = cloudProgress[q.id];
                                        return (
                                            <button key={q.id} onClick={() => { setCurrentIdx(i); setFeedback(null); setUserAnswer(cloudProgress[q.id]?.text || ""); }}
                                                className={`aspect-square rounded-xl flex items-center justify-center font-black text-xs border-2 transition-all ${currentIdx === i ? 'border-indigo-600 bg-indigo-50 text-indigo-600 scale-105 shadow-md' : state?.status === 'correct' ? 'bg-emerald-500 border-emerald-500 text-white' : state?.status === 'partial' ? 'bg-amber-400 border-amber-400 text-white' : state?.status === 'wrong' ? 'bg-rose-50 border-rose-500 text-white' : 'bg-white text-slate-300 hover:border-slate-300'}`}>
                                                {q.id}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="bg-indigo-600 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden group">
                               <h4 className="font-black text-xl mb-4">نصائح السيستم:</h4>
                               <ul className="text-sm space-y-3 font-bold list-disc list-inside opacity-90 leading-relaxed">
                                  <li>الموقع بيفهم "معنى" كلامك مش الكلمات.</li>
                                  <li>إجاباتك بتتحفظ أوتوماتيك في السحابة.</li>
                                  <li>لو السيستم هنج، متقلقش إجابتك محفوظة، دوس قيم تاني.</li>
                               </ul>
                            </div>
                        </aside>

                        <div className="lg:col-span-8">
                            <section className="bg-white rounded-[3rem] shadow-xl p-8 md:p-14 border border-slate-100 relative overflow-hidden animate-pop">
                                <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-indigo-500 to-indigo-700"></div>
                                <div className="space-y-10">
                                    <div className="flex justify-between items-center"><span className="bg-indigo-50 text-indigo-700 px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-sm">{currentQ.ch === 1 ? 'مدخل المناهج' : 'أنواع البحوث'}</span><span className="text-slate-200 font-black text-5xl opacity-30">#{currentQ.id}</span></div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 leading-tight">{currentQ.question}</h2>

                                    <div className="space-y-8">
                                        <textarea className="w-full p-8 rounded-[3rem] border-4 border-slate-50 focus:border-indigo-100 focus:bg-white transition-all min-h-[250px] text-xl bg-slate-50 shadow-inner outline-none font-medium leading-relaxed"
                                          placeholder="اكتب اللي فاهمه هنا يا بطل بأسلوبك..." value={userAnswer} onChange={(e) => setUserAnswer(e.target.value)} disabled={isLoading} />

                                        {(!feedback || feedback.status === 'error') ? (
                                          <button onClick={evaluate} disabled={isLoading || !userAnswer.trim()}
                                            className={`w-full py-6 rounded-3xl font-black text-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-4 ${!userAnswer.trim() ? 'bg-slate-100 text-slate-300' : 'bg-indigo-600 hover:bg-indigo-700 text-white hover:-translate-y-1'}`}>
                                            {isLoading ? <><div className="w-6 h-6 border-4 border-white/30 border-t-white rounded-full animate-spin"></div> براجع إجابتك بعناية...</> : "قيم إجابتي 
                                        ) : (
                                          <div ref={scrollRef} className={`p-10 rounded-[3.5rem] border-4 animate-pop shadow-2xl ${feedback.status === 'correct' ? 'bg-emerald-50 border-emerald-100 text-emerald-900 shadow-emerald-100' : feedback.status === 'partial' ? 'bg-amber-50 border-amber-100 text-amber-900 shadow-amber-100' : 'bg-rose-50 border-rose-100 text-rose-900 shadow-rose-100'}`}>
                                            <div className="flex flex-col md:flex-row items-center gap-8 mb-10">
                                               <div className={`p-8 rounded-[2.5rem] text-5xl shadow-2xl ${feedback.status === 'correct' ? 'bg-emerald-500 rotate-2' : feedback.status === 'partial' ? 'bg-amber-400 rotate-0' : 'bg-rose-500 -rotate-2'} text-white`}>
                                                 {feedback.status === 'correct' ? '🤩' : feedback.status === 'partial' ? '🧐' : '🤨'}
                                               </div>
                                               <div className="flex-1 text-center md:text-right space-y-1">
                                                  <h3 className="font-black text-3xl leading-tight">{comic}</h3>
                                                  <p className="text-xl font-bold opacity-80 leading-relaxed">{feedback.explanation}</p>
                                               </div>
                                            </div>
                                            <div className="bg-white/60 p-8 rounded-[2.5rem] border border-white/50 space-y-4 mb-10 shadow-inner">
                                               <span className="text-xs font-black text-indigo-600 uppercase tracking-widest block mb-2 underline decoration-2 underline-offset-4">الإجابة المعتمدة (مهم تقراها):</span>
                                               <p className="text-sm italic text-slate-600 leading-relaxed font-arabic">{currentQ.modelAnswer}</p>
                                            </div>
                                            <div className="flex flex-col sm:flex-row gap-4">
                                               <button onClick={() => setFeedback(null)} className="flex-1 bg-white text-slate-800 py-5 rounded-2xl font-black border-2 border-slate-100 hover:bg-slate-50 transition-all shadow-sm">تعديل إجابتي</button>
                                               <button onClick={() => { const next = (currentIdx + 1) % QUESTIONS.length; setCurrentIdx(next); setFeedback(null); setUserAnswer(cloudProgress[QUESTIONS[next].id]?.text || ""); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                                 className="flex-[2] bg-slate-900 text-white py-5 rounded-2xl font-black flex items-center justify-center gap-3 hover:bg-black transition-all shadow-xl">السؤال التالي</button>
                                            </div>
                                          </div>
                                        )}
                                        {feedback?.status === 'error' && <p className="text-center text-rose-600 font-bold bg-rose-50 p-4 rounded-2xl animate-pulse shadow-sm border border-rose-100">{feedback.explanation}</p>}
                                        {savedProgress && !feedback && <div className="flex items-center justify-center gap-3 text-emerald-500 py-6 animate-pulse"><span className="text-xs font-black tracking-widest uppercase">تم استعادة إجابتك السابقة بنجاح ✅</span></div>}
                                    </div>
                                </div>
                            </section>
                        </div>
                    </main>
                    <footer className="text-center py-10 opacity-30 text-[10px] font-black uppercase tracking-[0.2em]">نظام التدريب الذكي - إعداد مجدي عبد البصير - 2026</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
